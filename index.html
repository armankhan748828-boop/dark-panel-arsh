<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DARK PANEL ARSH</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #050505;
    color: white;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 90%;
    max-width: 400px;
}

.card {
    background: #101010;
    border: 1px solid #292929;
    border-radius: 18px;
    padding: 25px;
    box-shadow: 0 0 30px rgba(255,255,255,0.05);
}

h1 {
    text-align: center;
    margin-bottom: 25px;
    font-size: 26px;
}

input {
    width: 100%;
    padding: 14px;
    margin: 8px 0;
    border: 1px solid #333;
    border-radius: 10px;
    background: #181818;
    color: white;
    outline: none;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 12px;
    border: none;
    border-radius: 10px;
    background: white;
    color: black;
    font-weight: bold;
    cursor: pointer;
}

.dashboard {
    display: none;
}

.option {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #181818;
    padding: 15px;
    margin: 12px 0;
    border-radius: 12px;
}

.switch {
    width: 50px;
    height: 26px;
    background: #333;
    border-radius: 20px;
    position: relative;
    cursor: pointer;
}

.switch::after {
    content: "";
    width: 20px;
    height: 20px;
    background: white;
    border-radius: 50%;
    position: absolute;
    top: 3px;
    left: 3px;
    transition: 0.2s;
}

.switch.active {
    background: #00c853;
}

.switch.active::after {
    left: 27px;
}

.logout {
    background: #222;
    color: white;
    border: 1px solid #444;
}
</style>
</head>

<body>

<div class="container">

    <!-- LOGIN -->
    <div class="card" id="login">
        <h1>DARK PANEL ARSH</h1>

        <input type="text" id="username" placeholder="ID">
        <input type="password" id="password" placeholder="Password">

        <button onclick="login()">LOGIN</button>
    </div>

    <!-- DASHBOARD -->
    <div class="card dashboard" id="dashboard">

        <h1>DARK PANEL ARSH</h1>

        <div class="option">
            <span>Hadeshot Antiban</span>
            <div class="switch" onclick="toggle(this)"></div>
        </div>

        <div class="option">
            <span>Aim Kill</span>
            <div class="switch" onclick="toggle(this)"></div>
        </div>

        <div class="option">
            <span>Location</span>
            <div class="switch" onclick="toggle(this)"></div>
        </div>

        <div class="option">
            <span>Bypass</span>
            <div class="switch" onclick="toggle(this)"></div>
        </div>

        <button class="logout" onclick="logout()">LOGOUT</button>

    </div>

</div>

<script>
function login() {
    const id = document.getElementById("username").value;
    const password = document.getElementById("password").value;

    if (id === "arsh" && password === "1") {
        document.getElementById("login").style.display = "none";
        document.getElementById("dashboard").style.display = "block";
    } else {
        alert("Wrong ID or Password");
    }
}

function toggle(element) {
    element.classList.toggle("active");
}

function logout() {
    document.getElementById("dashboard").style.display = "none";
    document.getElementById("login").style.display = "block";
}
</script>

</body>
</html>
